# Workflow to test builds on non-productions branches
name: Test Build

on:
  push:
    branches-ignore: ['main']

concurrency:
  group: 'preview-${{github.ref_name}}'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
