# Simple workflow for deploying static content to GitHub Pages
name: Deploy Preview

on:
  # Runs on pushes targeting the default branch
  pull_request:
    branches: ['main']

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'preview-${{github.ref_name}}'
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: Preview-${{github.ref_name}}
      url: ${{ steps.deployment.outputs.page_url }}preview/${{github.ref_name}}/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        working-directory: ./apps/web
        run: npm run build
        env:
            VITE_BASE_URL: /CapstoneDyslexease/preview-${{github.ref_name}}/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: './apps/web/dist'
      - name: Deploy to Preview-${{github.ref_name}}
        id: deployment
        uses: actions/deploy-pages@v4
